[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "isl-language"
version = "1.0.0"
description = "Formatter and linter for MICROS RES 3700 ISL scripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
isl = "isl:main"

[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["isl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F"]
