[project]
name = "isl-language"
version = "1.0.0"
description = "MICROS RES 3700 ISL: Sublime Text syntax, formatter, linter, and Claude skill"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F"]
